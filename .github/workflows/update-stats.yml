name: Update Stats Cache

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download stats SVGs
        run: |
          mkdir -p assets
          curl -s "https://github-stats-extended-preview.vercel.app/api?username=PabloProgramming&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&count_private=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR" -o assets/stats.svg
          curl -s "https://github-readme-streak-stats.herokuapp.com/?user=PabloProgramming&theme=github_dark&hide_border=true" -o assets/streak.svg
          curl -s "https://github-stats-extended-preview.vercel.app/api/top-langs/?username=PabloProgramming&layout=compact&theme=github_dark&hide_border=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR" -o assets/top-langs.svg
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/; then
            git add assets/
            git commit -m "chore: update stats SVGs"
            git push
          fi
